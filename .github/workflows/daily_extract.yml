name: Extração Diária DGEG

on:
  schedule:
    - cron: '30 7 * * *'   # todos os dias às 7h30 UTC (8h30 Lisboa)
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests pandas python-dotenv

      - name: Correr extração
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python extract.py

      - name: Commit CSV para GitHub
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add dados.csv
          git diff --staged --quiet || git commit -m "actualiza dados.csv - $(date +'%Y-%m-%d')"
          git push